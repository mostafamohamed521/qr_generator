{% extends 'base_public.html' %}
{% load i18n %}
{% block title %}{% trans "FAQ" %}{% endblock %}
{% block nav_faq %}active{% endblock %}
{% block content %}
<section class="hero">
  <h1 style="font-family:'Space Grotesk',sans-serif;font-weight:800;font-size:clamp(2rem,4vw,2.8rem);margin-bottom:14px">{% trans "Frequently Asked Questions" %}</h1>
</section>
<div style="max-width:680px;margin:0 auto">
  {% for q in faqs %}
  <div class="faq-item">
    <button type="button" class="faq-q">
      <span>{{ q.q }}</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="faq-a">{{ q.a }}</div>
  </div>
  {% endfor %}
</div>
{% endblock %}
{% block extra_js %}
<script>
document.querySelectorAll('.faq-q').forEach(btn => {
  btn.addEventListener('click', () => {
    const ans = btn.nextElementSibling;
    const isOpen = ans.classList.contains('open');
    document.querySelectorAll('.faq-a').forEach(a => a.classList.remove('open'));
    document.querySelectorAll('.faq-q').forEach(b => b.classList.remove('open'));
    if (!isOpen) { ans.classList.add('open'); btn.classList.add('open'); }
  });
});
</script>
{% endblock %}
