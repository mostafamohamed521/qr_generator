{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | QR Forge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <script>(function(){var t=localStorage.getItem('qr-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;position:relative;z-index:1">
  <div style="font-family:'Fraunces',sans-serif;font-weight:600;font-size:clamp(5rem,20vw,10rem);line-height:1;color:var(--accent);margin-bottom:8px">404</div>
  <h1 style="font-family:'Fraunces',sans-serif;font-weight:700;font-size:1.5rem;margin-bottom:10px">Page not found</h1>
  <p style="color:var(--text-muted);max-width:360px;margin-bottom:28px">This page doesn't exist or the link may be broken. Let's get you back on track.</p>
  <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center">
    <a href="/" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:100px;font-weight:700;font-size:.9rem;text-decoration:none;color:#fff;background:var(--accent);box-shadow:0 6px 18px rgba(27,51,88,0.24)">← Back to Home</a>
    <a href="/app/" style="display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:100px;font-weight:700;font-size:.9rem;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border)">Generator</a>
  </div>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
