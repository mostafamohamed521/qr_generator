<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - Create Professional QR Codes</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }
        .tab-active {
            color: #7c3aed;
            border-bottom: 2px solid #7c3aed;
            background-color: #f3e8ff;
        }
        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #3b82f6);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c084fc;
            border-radius: 10px;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-indigo-100 min-h-screen">

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-r from-purple-600 to-blue-600 rounded-2xl mb-4 shadow-lg">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                </svg>
            </div>
            <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent mb-2">
                QR Code Generator
            </h1>
            <p class="text-gray-600 text-lg">Create professional QR codes - Supports URLs, Text, Contacts, WiFi, SMS, and Email</p>
        </div>

        <div class="grid md:grid-cols-3 gap-6">
            <!-- Main Generator -->
            <div class="md:col-span-2 bg-white rounded-3xl shadow-2xl overflow-hidden fade-in">
                <!-- Tabs -->
                <div class="border-b border-gray-200 overflow-x-auto">
                    <div class="flex">
                        <button onclick="switchTab('url')" id="tab-url" class="tab-btn flex-1 flex items-center justify-center gap-2 px-4 py-4 text-sm font-medium transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                            URL
                        </button>
                        <button onclick="switchTab('text')" id="tab-text" class="tab-btn flex-1 flex items-center justify-center gap-2 px-4 py-4 text-sm font-medium transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                            Text
                        </button>
                        <button onclick="switchTab('contact')" id="tab-contact" class="tab-btn flex-1 flex items-center justify-center gap-2 px-4 py-4 text-sm font-medium transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            Contact
                        </button>
                        <button onclick="switchTab('wifi')" id="tab-wifi" class="tab-btn flex-1 flex items-center justify-center gap-2 px-4 py-4 text-sm font-medium transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.14 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg>
                            WiFi
                        </button>
                        <button onclick="switchTab('sms')" id="tab-sms" class="tab-btn flex-1 flex items-center justify-center gap-2 px-4 py-4 text-sm font-medium transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                            SMS
                        </button>
                        <button onclick="switchTab('email')" id="tab-email" class="tab-btn flex-1 flex items-center justify-center gap-2 px-4 py-4 text-sm font-medium transition-all">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                            Email
                        </button>
                    </div>
                </div>

                <div class="p-6">
                    <form id="qr-form" method="post">
                        {% csrf_token %}
                        <input type="hidden" name="type" id="qr-type" value="url">
                        
                        <div id="url-form" class="form-section">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Website URL</label>
                            <input type="url" name="url" class="form-input" placeholder="https://example.com">
                            <p class="text-xs text-gray-500 mt-1">Enter a valid URL starting with http:// or https://</p>
                        </div>

                        <div id="text-form" class="form-section hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Text Content</label>
                            <textarea name="text" class="form-textarea" rows="4" placeholder="Enter your text here..."></textarea>
                        </div>

                        <div id="contact-form" class="form-section hidden space-y-3">
                            <div class="grid grid-cols-2 gap-3">
                                <input type="text" name="first_name" class="form-input" placeholder="First Name">
                                <input type="text" name="last_name" class="form-input" placeholder="Last Name">
                            </div>
                            <input type="tel" name="phone" class="form-input" placeholder="Phone Number">
                            <input type="tel" name="mobile" class="form-input" placeholder="Mobile Number">
                            <input type="email" name="email" class="form-input" placeholder="Email Address">
                            <input type="text" name="organization" class="form-input" placeholder="Organization/Company">
                            <input type="text" name="title" class="form-input" placeholder="Job Title">
                            <textarea name="address" class="form-textarea" rows="2" placeholder="Address"></textarea>
                            <input type="url" name="website" class="form-input" placeholder="Website URL">
                        </div>

                        <div id="wifi-form" class="form-section hidden space-y-3">
                            <input type="text" name="ssid" class="form-input" placeholder="Network Name (SSID)">
                            <input type="password" name="password" class="form-input" placeholder="Password">
                            <select name="encryption" class="form-select">
                                <option value="WPA">WPA/WPA2</option>
                                <option value="WEP">WEP</option>
                                <option value="nopass">No Password</option>
                            </select>
                        </div>

                        <div id="sms-form" class="form-section hidden space-y-3">
                            <input type="tel" name="phone" class="form-input" placeholder="Phone Number">
                            <textarea name="message" class="form-textarea" rows="3" placeholder="Your message here..."></textarea>
                        </div>

                        <div id="email-form" class="form-section hidden space-y-3">
                            <input type="email" name="email" class="form-input" placeholder="Email Address">
                            <input type="text" name="subject" class="form-input" placeholder="Subject">
                            <textarea name="body" class="form-textarea" rows="3" placeholder="Message body..."></textarea>
                        </div>

                        <div class="mt-6">
                            <button type="submit" class="btn-primary w-full py-3 text-white rounded-xl font-semibold shadow-lg">
                                Generate QR Code
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- QR Display & History -->
            <div class="space-y-6">
                <!-- QR Display -->
                <div class="bg-white rounded-2xl shadow-xl p-6 text-center">
                    <h3 class="text-xl font-semibold mb-4">Generated QR Code</h3>
                    <div id="qr-container" class="flex justify-center">
                        <div class="text-center py-12">
                            <svg class="w-24 h-24 text-gray-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path>
                            </svg>
                            <p class="text-gray-500">Fill in the form and click generate</p>
                        </div>
                    </div>
                    <div id="qr-actions" class="flex gap-3 mt-4 hidden">
                        <button onclick="downloadQR()" class="flex-1 flex items-center justify-center gap-2 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            Download
                        </button>
                        <button onclick="copyQR()" class="flex-1 flex items-center justify-center gap-2 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                            Copy
                        </button>
                    </div>
                </div>

                <!-- History -->
                <div class="bg-white rounded-2xl shadow-xl p-6">
                    <h3 class="text-xl font-semibold mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Recent QR Codes
                    </h3>
                    <div id="history-list" class="space-y-2 max-h-96 overflow-y-auto">
                        <p class="text-center text-gray-500 py-8">Loading...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentQRImage = '';

        function switchTab(tab) {
            // Update tab styles
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('tab-active');
                btn.classList.add('text-gray-500');
            });
            document.getElementById(`tab-${tab}`).classList.add('tab-active');
            document.getElementById(`tab-${tab}`).classList.remove('text-gray-500');
            
            // Show/hide forms
            document.querySelectorAll('.form-section').forEach(section => {
                section.classList.add('hidden');
            });
            document.getElementById(`${tab}-form`).classList.remove('hidden');
            document.getElementById('qr-type').value = tab;
        }

        document.getElementById('qr-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            Swal.fire({
                title: 'Generating...',
                text: 'Please wait while we create your QR code',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });
            
            try {
                const response = await fetch('/generate/', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.success) {
                    currentQRImage = data.qr_image;
                    document.getElementById('qr-container').innerHTML = `
                        <img src="${data.qr_image}" alt="QR Code" class="w-64 h-64 rounded-xl shadow-lg">
                    `;
                    document.getElementById('qr-actions').classList.remove('hidden');
                    loadHistory();
                    Swal.fire({
                        icon: 'success',
                        title: 'Success!',
                        text: 'QR code generated successfully',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Failed to generate QR code'
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Connection error. Please try again.'
                });
            }
        });

        function downloadQR() {
            if (currentQRImage) {
                const link = document.createElement('a');
                link.download = 'qrcode.png';
                link.href = currentQRImage;
                link.click();
                Swal.fire({
                    icon: 'success',
                    title: 'Downloaded!',
                    text: 'QR code downloaded successfully',
                    timer: 1500,
                    showConfirmButton: false
                });
            }
        }

        async function copyQR() {
            if (currentQRImage) {
                try {
                    const response = await fetch(currentQRImage);
                    const blob = await response.blob();
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            [blob.type]: blob
                        })
                    ]);
                    Swal.fire({
                        icon: 'success',
                        title: 'Copied!',
                        text: 'QR code copied to clipboard',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } catch (err) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Failed to copy QR code'
                    });
                }
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch('/history/');
                const data = await response.json();
                
                if (data.history.length > 0) {
                    const historyHtml = data.history.map(item => `
                        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                            <div>
                                <p class="text-sm font-medium text-gray-800">${item.type}</p>
                                <p class="text-xs text-gray-500">${item.created_at}</p>
                            </div>
                            <button onclick="deleteHistory(${item.id})" class="text-red-500 hover:text-red-700 transition">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    `).join('');
                    document.getElementById('history-list').innerHTML = historyHtml;
                } else {
                    document.getElementById('history-list').innerHTML = '<p class="text-center text-gray-500 py-8">No history yet</p>';
                }
            } catch (error) {
                console.error('Error loading history:', error);
            }
        }

        async function deleteHistory(id) {
            const result = await Swal.fire({
                title: 'Are you sure?',
                text: 'This action cannot be undone',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it',
                cancelButtonText: 'Cancel'
            });
            
            if (result.isConfirmed) {
                try {
                    await fetch(`/delete/${id}/`, { method: 'DELETE' });
                    loadHistory();
                    Swal.fire('Deleted!', 'QR code has been deleted.', 'success');
                } catch (error) {
                    Swal.fire('Error!', 'Failed to delete QR code.', 'error');
                }
            }
        }

        // Load history on page load
        loadHistory();
        
        // Set default active tab
        switchTab('url');
    </script>
</body>
</html>
