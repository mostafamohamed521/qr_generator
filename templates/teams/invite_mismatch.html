{% extends 'base.html' %}
{% block title %}Invite Mismatch{% endblock %}
{% block content %}
<div style="max-width:440px;margin:60px auto;text-align:center">
  <div class="stat-card" style="padding:36px">
    <div style="font-size:3rem;margin-bottom:16px">⚠️</div>
    <h1 style="font-family:'Fraunces',sans-serif;font-weight:700;font-size:1.4rem;margin-bottom:8px">Email mismatch</h1>
    <p style="color:var(--text-muted)">This invite was sent to <strong>{{ invite.email }}</strong> but you're logged in with a different email. Please log in with the correct account.</p>
    <a href="{% url 'accounts:logout' %}" class="btn-secondary" style="text-decoration:none;display:inline-flex;margin-top:18px;padding:10px 20px">Log out &amp; switch</a>
  </div>
</div>
{% endblock %}
